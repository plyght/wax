name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  test:
    name: CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Use native Rust executables for lifecycle fixtures
        if: runner.os != 'Windows'
        shell: bash
        run: dirname "$(rustup which cargo)" >> "$GITHUB_PATH"

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --locked

      - name: Set up Node for isolated tool migration fixtures
        if: runner.os != 'Windows'
        uses: actions/setup-node@v4
        env:
          # Hosted image npm files can be world-writable; keep the backend safety gate.
          RUNNER_TOOL_CACHE: ${{ runner.temp }}/wax-node-tool-cache
        with:
          node-version: '22'

      - name: Set up Bun for isolated tool migration fixtures
        if: runner.os != 'Windows'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'

      - name: Verify genuine npm and Bun tool lifecycles
        if: runner.os != 'Windows'
        run: cargo test --locked --test tool_migration -- --ignored --nocapture
