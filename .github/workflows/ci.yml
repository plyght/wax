name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  test:
    name: CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Use native Rust executables for lifecycle fixtures
        if: runner.os != 'Windows'
        shell: bash
        run: dirname "$(rustup which cargo)" >> "$GITHUB_PATH"

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --locked

      - name: Set up Node for isolated tool migration fixtures
        if: runner.os != 'Windows'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Isolate Node backend permissions for lifecycle fixtures
        if: runner.os != 'Windows'
        shell: bash
        run: |
          node_root="$(dirname "$(dirname "$(node -p 'process.execPath')")")"
          private="$(mktemp -d "$RUNNER_TEMP/wax-node.XXXXXX")"
          mkdir -p "$private/bin" "$private/lib/node_modules"
          cp "$node_root/bin/node" "$private/bin/node"
          cp -R "$node_root/lib/node_modules/npm" "$private/lib/node_modules/"
          ln -s ../lib/node_modules/npm/bin/npm-cli.js "$private/bin/npm"
          # Normalize only this disposable copy, never the shared hosted tool cache.
          chmod -R go-w "$private"
          echo "$private/bin" >> "$GITHUB_PATH"

      - name: Set up Bun for isolated tool migration fixtures
        if: runner.os != 'Windows'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'

      - name: Verify genuine npm and Bun tool lifecycles
        if: runner.os != 'Windows'
        run: cargo test --locked --test tool_migration -- --ignored --nocapture
